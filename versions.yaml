# What the repository pins from outside it, but its Go modules (go.mod) and the actions the
# workflows run (Dependabot's). It is go-tools' versions format: `go tool task versions` says what
# is behind.

- name: actionlint
  kind: module
  source: github.com/rhysd/actionlint/cmd/actionlint
  version: v1.7.12
  track: github-release https://github.com/rhysd/actionlint
  note: go tool task lint:workflows, which task check runs. spin's version.
